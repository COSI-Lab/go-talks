apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-talks
  namespace: cosi
  labels:
    app: go-talks #DO NOT JST PUT "C"!!!
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-talks
  template:
    metadata:
      labels:
        app: go-talks
    spec:
      containers:
        - name: go-talks
          image: registry.cosi.clarkson.edu/cosi-meta/go-talks
          ports:
            - containerPort: 80
          #CONECT TO THE POD HERE PT 1
          volumeMounts:
            - name: data
              mountPath: /home/go-talks/go-talks/data
          #^^^
          #Resources where unessisary
            #no limits for the free!
      #CONECT TO THE POD HERE PT 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-talks-data # use name from PersistentVolumeClaim
      #^^^
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: go-talks-data #Kabab case, USE FOR PART 2!
    namespace: cosi
spec:
    accessModes:
    - ReadWriteMany #INFANET EDITS
    storageClassName: longhorn #burg
    resources:
        requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: go-talks
  namespace: cosi
spec:
  selector: {app: go-talks}
  ports:
    - port: 80
      targetPort: 80 #The port you are using for the containerPort.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: go-talks-tls
  namespace: cosi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`talks.cosi.clarkson.edu`) || Host(`talks.cslabs.clarkson.edu`) || Host(`sklat.cosi.clarkson.edu`) || Host(`sklat.cslabs.clarkson.edu`)
      services:
        - name: go-talks
          port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: go-talks-redirect
  namespace: cosi
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`talks.cosi.clarkson.edu`) || Host(`talks.cslabs.clarkson.edu`) || Host(`sklat.cosi.clarkson.edu`) || Host(`sklat.cslabs.clarkson.edu`)
    kind: Rule
    middlewares:
    - name: https-redirect
      namespace: cosi
    services: # stupid ass bullshit
        - name: noop@internal
          kind: TraefikService
