apiVersion: apps/v1
kind: Deployment
metadata:
  name: talks
  namespace: cosi
  labels:
    app: talks #DO NOT JST PUT "C"!!!
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talks
  template:
    metadata:
      labels:
        app: talks
    spec:
      containers:
        - name: talks
          image: registry.cosi.clarkson.edu/cosi-meta/talks
          ports:
            - containerPort: 8080
          #CONECT TO THE POD HERE PT 1
          volumeMounts:
            - name: data
              mountPath: /home/talks/talks/data
          #^^^
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      #CONECT TO THE POD HERE PT 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: talks-data # use name from PersistentVolumeClaim
      #^^^
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: talks-data #Kabab case, USE FOR PART 2!
    namespace: cosi
spec:
    accessModes:
    - ReadWriteMany #INFANET EDITS
    storageClassName: longhorn #burg
    resources:
        requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: talks
  namespace: cosi
spec:
  selector: {app: talks}
  ports:
    - port: 80
      targetPort: 8080 #The port you are using for the containerPort.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: talks-tls
  namespace: cosi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`talks.cosi.clarkson.edu`)
      services:
        - name: talks
          port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: talks-redirect
  namespace: cosi
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`talks.cosi.clarkson.edu`)
    kind: Rule
    middlewares:
    - name: https-redirect
      namespace: cosi
    services: # stupid ass bullshit
        - name: noop@internal
          kind: TraefikService
